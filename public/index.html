<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gsd-monitor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>gsd-monitor</h1>
        <span class="sub" id="root"></span>
      </div>
      <div class="summary" id="summary"></div>
      <div class="controls">
        <input id="filter" type="search" placeholder="アプリ・マイルストーンで絞り込み" />
        <label class="toggle"><input id="hideDone" type="checkbox" /> 完了を隠す</label>
        <button id="rescan" type="button">今すぐ走査</button>
        <button id="notify" type="button" hidden>通知を有効にする</button>
        <span class="sub" id="notifyState"></span>
        <span class="sub" id="scanned"></span>
      </div>
    </header>
    <main class="layout">
      <section>
        <div id="cards" class="cards"></div>
      </section>
      <aside class="events">
        <h2>変化の履歴</h2>
        <ol id="events"></ol>
      </aside>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
